<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Restaurant - شاشة المطبخ</title>
    <!-- مكتبة Socket.io -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(rgba(0, 0, 0, 0.8), rgba(0, 0, 0, 0.8)), 
                        url('https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #fff;
            padding: 20px;
            margin: 0;
            min-height: 100vh;
        }
        h1 {
            color: #ff4757;
            text-align: center;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            margin-bottom: 5px;
        }
        .subtitle {
            color: #ffa502;
            text-align: center;
            font-size: 1.2em;
            margin-bottom: 15px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }
        .audio-enable-btn {
            display: block;
            margin: 0 auto 25px auto;
            background: #ffa502;
            color: #000;
            border: none;
            padding: 10px 20px;
            font-size: 1em;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: 0.3s;
        }
        .audio-enable-btn:hover {
            background: #2ed573;
            color: #fff;
        }
        #orders {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 650px;
            margin: 0 auto;
        }
        .order-card {
            background: rgba(30, 30, 30, 0.95);
            border-right: 6px solid #ff4757;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            border-top: 1px solid #444;
            animation: fadeIn 0.3s ease-in-out;
            transition: 0.3s;
        }
        .order-card.ready {
            border-right-color: #2ed573;
            background: rgba(20, 50, 30, 0.95);
        }
        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #444;
            padding-bottom: 10px;
            margin-bottom: 10px;
        }
        .table-badge {
            background: #ff4757;
            color: #fff;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 1.1em;
        }
        .item-row {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            border-bottom: 1px dashed #444;
            font-size: 1.1em;
        }
        .grand-total {
            margin-top: 12px;
            padding-top: 8px;
            border-top: 2px solid #ffa502;
            text-align: left;
            font-size: 1.2em;
            color: #2ed573;
            font-weight: bold;
        }
        .time-text {
            color: #aaa;
            font-size: 0.9em;
        }
        .ready-btn {
            background: #2ed573;
            color: #000;
            border: none;
            padding: 10px;
            width: 100%;
            border-radius: 6px;
            font-weight: bold;
            font-size: 1.1em;
            cursor: pointer;
            margin-top: 15px;
            transition: 0.2s;
        }
        .ready-btn:hover {
            background: #26af5f;
            color: #fff;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <h1>Restaurant</h1>
    <div class="subtitle">👨‍🍳 شاشة المطبخ - متابعة الطلبات الحية</div>
    
    <!-- زر تفعيل التنبيه الصوتي لمنع حظر المتصفح -->
    <button id="enableAudioBtn" class="audio-enable-btn" onclick="enableAudio()">🔔 اضغط هنا للتأكد من تفعيل التنبيه الصوتي</button>

    <div id="orders">
        <p style="text-align: center; color: #ccc; font-size: 1.2em; background: rgba(0,0,0,0.5); padding: 15px; border-radius: 8px;">في انتظار وصول الطلبات من الطاولات...</p>
    </div>

    <script>
        // إعداد الاتصال السريع جداً لتفتح الصفحة فوراً بدون أي تأخير
        const socket = io({
            transports: ['polling', 'websocket'],
            reconnectionAttempts: 5,
            reconnectionDelay: 1000,
            timeout: 10000
        });

        // مراقبة حالة الاتصال في الخلفية
        socket.on('connect', function() {
            console.log("🟢 متصل بسيرفر المطبخ بنجاح! معرف الاتصال:", socket.id);
        });

        socket.on('connect_error', function(err) {
            console.log("🔴 خطأ في اتصال المطبخ بالسيرفر:", err);
        });

        const ordersDiv = document.getElementById('orders');
        let audioCtx = null;

        // دالة تفعيل بيئة الصوت بضغطة زر
        function enableAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            playBeep();
            const btn = document.getElementById('enableAudioBtn');
            btn.innerText = '🔊 التنبيه الصوتي مفعّل بنجاح';
            btn.style.background = '#2ed573';
            btn.style.color = '#fff';
        }

        // دالة توليد نغمة تنبيه مزدوجة (Ding-Dong) في المطبخ
        function playBeep() {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                const now = audioCtx.currentTime;

                // النغمة الأولى (High Beep)
                const osc1 = audioCtx.createOscillator();
                const gain1 = audioCtx.createGain();
                osc1.type = 'sine';
                osc1.frequency.setValueAtTime(880, now);
                gain1.gain.setValueAtTime(0.2, now);
                gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc1.connect(gain1);
                gain1.connect(audioCtx.destination);
                osc1.start(now);
                osc1.stop(now + 0.2);

                // النغمة الثانية (Lower Beep)
                const osc2 = audioCtx.createOscillator();
                const gain2 = audioCtx.createGain();
                osc2.type = 'sine';
                osc2.frequency.setValueAtTime(1046.5, now + 0.25);
                gain2.gain.setValueAtTime(0.2, now + 0.25);
                gain2.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                osc2.connect(gain2);
                gain2.connect(audioCtx.destination);
                osc2.start(now + 0.25);
                osc2.stop(now + 0.5);

            } catch (e) {
                console.log("Audio not supported or blocked by browser policy");
            }
        }

        // الاستماع للطلبات الجديدة الواردة من السيرفر
        socket.on('new_order', function(data) {
            console.log("📦 وصلت طلبية جديدة:", data);
            playBeep(); // تشغيل صوت التنبيه فور وصول الطلبية

            if (ordersDiv.querySelector('p')) {
                ordersDiv.innerHTML = '';
            }

            const card = document.createElement('div');
            card.className = 'order-card';
            
            let itemsHtml = '';
            data.items.forEach(i => {
                itemsHtml += `
                    <div class="item-row">
                        <span>${i.name} (<strong>×${i.quantity}</strong>)</span>
                        <span style="color: #ffa502;">${i.total} دج</span>
                    </div>
                `;
            });

            card.innerHTML = `
                <div class="order-header">
                    <span class="table-badge">طاولة رقم: ${data.table}</span>
                    <span class="time-text">🕒 ${data.time}</span>
                </div>
                <div style="margin: 10px 0;">
                    ${itemsHtml}
                </div>
                <div class="grand-total">
                    المجموع الإجمالي: ${data.total} دج
                </div>
                <button class="ready-btn" onclick="markReady(this)">الطلب جاهز للتسليم ✅</button>
            `;
            
            ordersDiv.prepend(card);
        });

        function markReady(button) {
            const card = button.closest('.order-card');
            card.classList.add('ready');
            button.innerText = 'تم التسليم / جاهز 🟢';
            button.style.background = '#555';
            button.style.color = '#aaa';
            button.disabled = true;
        }
    </script>
</body>
</html>
